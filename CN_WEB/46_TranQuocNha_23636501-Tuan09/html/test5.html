<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <title>ôn tập</title>
    <style>
      #list {
        display: flex;
        justify-content: start;
      }
    </style>
    <script>
      function kiemTraTen() {
        let ten = document.getElementById("txtHoTen").value;
        let mauTen = /^[A-Z][A-Za-z]*(\s[A-Z][A-Za-z]*)+$/;
        document.getElementById("errHoTen").innerHTML = mauTen.test(ten)
          ? "Ok"
          : "No";
        return mauTen.test(ten);
      }
      function kiemTraDiaChi() {
        let diaChi = document.getElementById("txtDiaChi").value;
        let mauDiaChi = /^\d{3,5}(\s[A-Z][a-z]*)+$/;
        document.getElementById("errDiaChi").innerHTML = mauDiaChi.test(diaChi)
          ? "OK"
          : "NO";
        return mauDiaChi.test(diaChi);
      }
      function kiemTraTuoi() {
        let ns = document.getElementById("txtNS").value;
        let ngaySinh = new Date(ns);
        let today = new Date();
        let tuoi = today.getFullYear() - ngaySinh.getFullYear();
        document.getElementById("errNS").innerHTML = tuoi >= 16 ? "OK" : "NO";
        return tuoi >= 16;
      }
      function kiemTraMail() {
        let mail = document.getElementById("txtMail").value;
        let mauMail = /^\w+@gmail\.com$/;
        document.getElementById("errMail").innerHTML = mauMail.test(mail)
          ? "OK"
          : "NO";
        return mauMail.test(mail);
      }
      /* function tinhHocPhi(khoaHoc){
            switch (khoaHoc){
                case "HTML": return "500";
                case "JAVA": return "400";
                case "C++": return "300";
                case "C": return "200";
                default : return "0";
            }
        }
        */
      let count = 1;
      function signIn() {
        if (
          !kiemTraTen() ||
          !kiemTraDiaChi() ||
          !kiemTraTuoi() ||
          !kiemTraMail()
        ) {
          alert("Phải nhập đúng dữ liệu");
          return false;
        }
        let ten = document.getElementById("txtHoTen").value;
        let diaChi = document.getElementById("txtDiaChi").value;
        let mail = document.getElementById("txtMail").value;
        let ns = document.getElementById("txtNS").value;

        let table = document
          .getElementById("tableinfo")
          .getElementsByTagName("tbody")[0];
        let newrow = table.insertRow();

        newrow.insertCell(0).innerHTML = count;
        newrow.insertCell(1).innerHTML = ten;
        newrow.insertCell(2).innerHTML = ns;
        newrow.insertCell(3).innerHTML = diaChi;
        newrow.insertCell(4).innerHTML = mail;

        count++;
        // $("#mymodal").modal("hide");
      }
    </script>
  </head>
  <body>
    <div class="container-fluid">
      <div id="list" class="mt-3">
        <img src="../img/logo.jpg" alt="magazin" width="150px" class="mb-3" />
        <ul class="nav">
          <li class="nav-item">
            <a href="#" class="nav-link">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Đăng ký</a>
          </li>
          <li class="nav-item">
            <button
              type="button"
              class="nav-link"
              data-bs-toggle="modal"
              data-bs-target="#mymodal"
            >
              Nhập dữ liệu
            </button>
          </li>
        </ul>
      </div>
      <div class="anh">
        <img src="../img/website.png" alt="magazin" width="100%" />
      </div>
      <table class="table table-hover" id="tableinfo">
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Mail</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="modal fade" id="mymodal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h4>Đăng ký tài khoản</h4>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <label for="txtHoTen" class="form-label">Họ và tên</label>
              <input
                type="text"
                id="txtHoTen"
                class="form-control"
                onblur="kiemTraTen()"
              />
              <span class="text-danger" id="errHoTen">*</span><br />

              <label for="txtNS" class="form-label">Ngày sinh</label>
              <input
                type="date"
                id="txtNS"
                class="form-control"
                onblur="kiemTraTuoi()"
              />
              <span class="text-danger" id="errNS">*</span>

              <label for="txtDiaChi" class="form-label">Địa chỉ</label>
              <input
                type="text"
                id="txtDiaChi"
                class="form-control"
                placeholder="VD: 675 Go Vap"
                onblur="kiemTraDiaChi()"
              />
              <span class="text-danger" id="errDiaChi">*</span>

              <label for="txtMail" class="form-label">Email</label>
              <input
                type="text"
                id="txtMail"
                class="form-control"
                placeholder="VD: abc5@gmail.com"
                onblur="kiemTraMail()"
              />
              <span class="text-danger" id="errMail">*</span>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-success w-100"
                  onclick="signIn()"
                >
                  Lưu
                </button>
                <button
                  type="button"
                  class="btn btn-success w-100"
                  data-bs-dismiss="modal"
                >
                  Đóng
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Để trong container -->
      <div style="text-align: center" class="footer">
        <p style="font-size: 15px">MSSV: 24692521</p>
        <p style="font-size: 15px">Lê Thanh Vân</p>
        <p style="font-size: 15px">DHKTPM19B</p>
      </div>
    </div>
  </body>
</html>
