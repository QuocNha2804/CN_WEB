<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <title>Test</title>
    <style>
      #list {
        display: flex;
        justify-content: start;
      }
    </style>
    <script>
      function kiemTraTen() {
        let ten = document.getElementById("txtHoTen").value;
        let mauTen = /^[A-Z][A-Za-z]*(\s[A-Z][A-Za-z]*)+$/;
        document.getElementById("errHoTen").innerHTML = mauTen.test(ten)
          ? "OK"
          : "NO";
        return mauTen.test(ten);
      }

      function kiemTraTuoi() {
        let ns = document.getElementById("txtNgaySinh").value;
        let ngaySinh = new Date(ns);
        let today = new Date();
        let tuoi = today.getFullYear() - ngaySinh.getFullYear();
        document.getElementById("errNgaySinh").innerHTML =
          tuoi >= 16 ? "OK" : "NO";
        return tuoi >= 16;
      }

      function kiemTraDiaChi() {
        let diaChi = document.getElementById("txtDiaChi").value;
        let mauDiaChi = /^\d{3,5}(\s[A-Z][a-z]*)+$/;
        document.getElementById("errDiaChi").innerHTML = mauDiaChi.test(diaChi)
          ? "OK"
          : "NO";
        return mauDiaChi.test(diaChi);
      }

      function tinhHocPhi(khoaHoc) {
        switch (khoaHoc) {
          case "Frontend":
            return "5,000,000đ";
          case "Backend":
            return "6,000,000đ";
          case "Fullstack":
            return "10,000,000đ";
          default:
            return "0đ";
        }
      }

      let count = 1;

      function Singin() {
        if (!kiemTraTen() || !kiemTraTuoi() || !kiemTraDiaChi()) {
          alert("Phải nhập đúng dữ liệu");
          return false;
        }

        let ten = document.getElementById("txtHoTen").value;
        let gioiTinh = document.querySelector(
          'input[name="gender"]:checked',
        ).value;
        let ngaySinh = document.getElementById("txtNgaySinh").value;
        let diaChi = document.getElementById("txtDiaChi").value;
        let khoaHoc = document.getElementById("selectKhoaHoc").value;
        let hocPhi = tinhHocPhi(khoaHoc);

        let table = document
          .getElementById("tableinfo")
          .getElementsByTagName("tbody")[0];
        let newrow = table.insertRow();

        newrow.insertCell(0).innerHTML = count;
        newrow.insertCell(1).innerHTML = ten;
        newrow.insertCell(2).innerHTML = gioiTinh;
        newrow.insertCell(3).innerHTML = ngaySinh;
        newrow.insertCell(4).innerHTML = diaChi;
        newrow.insertCell(5).innerHTML = khoaHoc;
        newrow.insertCell(6).innerHTML = hocPhi;

        count++;
      }
    </script>
  </head>

  <body>
    <div class="container-fluid">
      <div class="anh">
        <img
          src="../img/website.png"
          alt="magazin"
          style="object-fit: cover"
          width="100%"
        />
      </div>
      <div id="list" class="mt-2">
        <ul class="nav">
          <li class="nav-item">
            <a href="#" class="nav-link">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-bs-toggle="modal"
              data-bs-target="#mymodal"
              >Đăng ký</a
            >
          </li>
        </ul>
      </div>

      <table class="table table-hover" id="tableinfo">
        <thead>
          <tr>
            <th>STT</th>
            <th>Họ và tên</th>
            <th>Giới tính</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Khóa học</th>
            <th>Học phí</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="modal" id="mymodal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h4>Đăng ký tài khoản</h4>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <label for="txtHoTen" class="form-label">Họ tên</label>
              <input
                type="text"
                id="txtHoTen"
                class="form-control"
                placeholder="VD: Tran Quoc Nha"
                onblur="kiemTraTen()"
              />
              <span class="text-danger" id="errHoTen">*</span><br />

              <label class="form-label">Giới tính</label><br />
              <input type="radio" name="gender" value="Nam" checked /> Nam
              <input type="radio" name="gender" value="Nữ" /> Nữ<br /><br />

              <label for="txtNgaySinh" class="form-label">Ngày sinh</label>
              <input
                type="date"
                id="txtNgaySinh"
                class="form-control"
                onblur="kiemTraTuoi()"
              />
              <span class="text-danger" id="errNgaySinh">*</span><br />

              <label for="txtDiaChi" class="form-label">Địa chỉ</label>
              <input
                type="text"
                id="txtDiaChi"
                class="form-control"
                placeholder="VD: 842 Nguyen Kiem"
                onblur="kiemTraDiaChi()"
              />
              <span class="text-danger" id="errDiaChi">*</span><br />

              <label for="selectKhoaHoc" class="form-label">Khóa học</label>
              <select id="selectKhoaHoc" class="form-select">
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Fullstack">Fullstack</option></select
              ><br />
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-success w-100"
                data-bs-dismiss="modal"
                onclick="Singin()"
              >
                Lưu
              </button>
            </div>
          </div>
        </div>
      </div>
      <div style="text-align: center">
        <h2>Tran Quoc Nha</h2>
        <h2>23636501</h2>
      </div>
    </div>
  </body>
</html>
