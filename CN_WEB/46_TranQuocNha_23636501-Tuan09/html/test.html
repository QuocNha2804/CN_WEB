<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <style>
        #nam{
            margin-right: 10px;
        }
    </style>
    <script>
        function kiemTraTen(){
            let ten  = document.getElementById("txtHoTen").value;
            let mauTen = /^[A-Z][a-z]*(\s[A-Z][a-z]*)+$/;
            if(mauTen.test(ten)){
                document.getElementById("errHoTen").innerHTML= "OK";
                return true;
            }
            else{
                document.getElementById("errHoTen").innerHTML= "NO";
                return false;
            }
        }
        function kiemTraTuoi(){
            let ns = document.getElementById("txtNgaySinh").value;
            let ngaySinh = new Date(ns);
            let namSinh = ngaySinh.getFullYear();
            let ngayHienTai = new Date();
            let namHienTai = ngayHienTai.getFullYear();
            if(namHienTai - namSinh >=16){
                document.getElementById("errNgaySinh").innerHTML= "YES";
                return true;
            }
            else{
                document.getElementById("errNgaySinh").innerHTML= "NO";
                return false;
            }

        }
        function kiemTraEmail(){
            let mail  = document.getElementById("txtEmail").value;
            let mauMail = /^[a-zA-Z0-9!@$%^&*]+@gmail.com$/;
            if(mauMail.test(mail)){
                document.getElementById("errEmail").innerHTML= "OK";
                return true;
            }
            else{
                document.getElementById("errEmail").innerHTML= "NO";
                return false;
            }
        }
        function kiemTraDiaChi(){
            let diaChi  = document.getElementById("txtDiaChi").value;
            let mauDiaChi = /^[0-9]{3}\s[A-Z][a-z]*(\s[A-Z][a-z]*)+$/;
            if(mauDiaChi.test(diaChi)){
                document.getElementById("errDiaChi").innerHTML= "OK";
                return true;
            }
            else{
                document.getElementById("errDiaChi").innerHTML= "NO";
                return false;
            }
        }
        function kiemTraSDT(){
            let sdt = document.getElementById("txtSDT").value;
            let mauSDT = /^0[2-9][0-9]{8}$/;
            if(mauSDT.test(sdt)){
                document.getElementById("errSDT").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errSDT").innerHTML = "NO";
                return false;
            }
        }
        
        let count = 1
        function Signin(){
            if(!kiemTraTen() || !kiemTraTuoi() || !kiemTraDiaChi() || !kiemTraEmail() || !kiemTraSDT ){
                alert("Can nhap dung du lieu");
                return false;
            }

            let hoTen = document.getElementById("txtHoTen").value;
            let ngaySinh = document.getElementById("txtNgaySinh").value;
            let eMail = document.getElementById("txtEmail").value;
            let diaChi = document.getElementById("txtDiaChi").value;
            let sdt = document.getElementById("txtSDT").value;
            let chuyenNganh = document.getElementById("cbChuyenNganh").value;

            let gioiTinh = document.querySelector("input[name=gt]:checked").value;

            let table = document.getElementById("tableinfo").getElementsByTagName("tbody")[0];
            let newrow = table.insertRow();

            let cell0 = newrow.insertCell(0);
            let cell1 = newrow.insertCell(1);
            let cell2 = newrow.insertCell(2);
            let cell3 = newrow.insertCell(3);
            let cell4 = newrow.insertCell(4);
            let cell5 = newrow.insertCell(5);
            let cell6 = newrow.insertCell(6);
            let cell7 = newrow.insertCell(7);

            cell0.innerHTML = count;
            cell1.innerHTML = hoTen;
            cell2.innerHTML = ngaySinh;
            cell3.innerHTML = eMail;
            cell4.innerHTML = diaChi;
            cell5.innerHTML = sdt;
            cell6.innerHTML = gioiTinh;
            cell7.innerHTML = chuyenNganh;

            count++;

        }


    </script>
    <title>Document</title>
</head>
<body>
    <div class="container-fluid">
        <div class="anh">
            <img src="../img/banner-5.png" alt="banner" width="100%">
        </div>
        <div>
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link" href="#">home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#mymodal">Modal</a>
                </li>
            </ul>
        </div>
        <table class="table table-hover" id="tableinfo">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Ho Ten</th>
                    <th>Ngay Sinh</th>
                    <th>Email</th>
                    <th>Dia Chi</th>
                    <th>So dien thoai</th>
                    <th>GIoi Tinh</th>
                    <th>Chuyen nganh</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="modal" id="mymodal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4>Test Model</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label for="txtHoTen" class="form-label">Ho Ten</label>
                        <input type="text" id="txtHoTen" class="form-control"  onblur="kiemTraTen()">
                        <span id="errHoTen" class="text-danger">*</span><br>

                        <label for="txtNgaySinh" class="form-label">Ngay Sinh</label>
                        <input type="date" id="txtNgaySinh" class="form-control" onblur="kiemTraTuoi()">
                        <span id="errNgaySinh" class="text-danger">*</span><br>

                        <label for="txtEmail" class="form-label">Email</label>
                        <input type="text" id="txtEmail" class="form-control" onblur="kiemTraEmail()">
                        <span id="errEmail" class="text-danger">*</span><br>

                        <label for="txtDiaChi" class="form-label">Dia Chi</label>
                        <input type="text" id="txtDiaChi" class="form-control" onblur="kiemTraDiaChi()">
                        <span id="errDiaChi" class="text-danger">*</span><br>

                        <label for="txtSDT" class="form-label">So Dien Thoai</label>
                        <input type="text" id="txtSDT" class="form-control" onblur="kiemTraSDT()">
                        <span id="errSDT" class="text-danger">*</span><br>

                        <label class="form-label">Gioi tinh</label><br>
                        <input type="radio" class="form-check-input" name="gt" id="nam" value="Nam">Nam
                        <input type="radio" class="form-check-input" name="gt" value="Nu">Nu<br><br>

                        <label for="cbChuyenNganh" class="form-label">Chuyen Nganh</label>
                        <select name="cbChuyenNganh" id="cbChuyenNganh" class="form-select">
                            <option value="KTPM">KTPM</option>
                            <option value="HTTT">HTTT</option>
                            <option value="KHMT">KHMT</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" data-bs-dismiss="modal" style="width: 100%;" onclick="Signin()">Luu</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
