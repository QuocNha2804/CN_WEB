<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <title>Bai2d</title>
  </head>
  <body>
    <div class="container">
      <form class="was-validated">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">First Name</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="First Name"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please choose a First name.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Last Name</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="Last Name"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please choose a lastname.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">User Name</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="User Name"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please choose a username.</div>
          </div>
          <!-- hang 2 -->
          <div class="col-md-6">
            <label class="form-label">City</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="City"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please provide a valid city.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label">State</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="State"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please provide a valid state.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Zip</label>
            <input
              type="text"
              class="form-control"
              required
              placeholder="User Name"
            />
            <div class="valid-feedback">Loods good!</div>
            <div class="invalid-feedback">Please provide a valid zip.</div>
          </div>
          <div class="col-md-12 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="checkbox"
              required
            />
            <label for="checkbox" class="form-check-label"
              >Agree to term and conditions</label
            >
            <div class="valid-feedback">Looks good!!!</div>
            <div class="invalid-feedback">You must argee before submiting</div>
          </div>
          <div class="col-md-1212">
            <button class="btn btn-primary">Submit form</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
