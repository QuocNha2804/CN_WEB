<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date</title>
    <style>
        div{
            border: 2px solid grey;
            width: 20%;
            margin: 200px auto;
            text-align:justify ;
        }
        div .o{
            margin-bottom: 5px;
            width: 50%;
        }
    </style>
</head>
<body>
    <div>
        Name:<br>
        <input type="text"><br>
        Telephone Number:<br>
        <input class="o" type="tel"><br>
        Email:<br>
        <input class="o" type="email"><br>
        Favorite Color:<br>
        <span><input type="color"><br></span>
        Date of Birth:<br>
        <input class="o" type="date"><br>
        <input type="submit">
    </div>
</body>
</html>
