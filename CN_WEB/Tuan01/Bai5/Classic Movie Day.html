<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Movie Day</title>
    <style>
        table{
            border: 2px solid black;
            margin: auto;
        }
        th, td{
            border: 2px solid black;
        }
        h1{
            font-size: medium;
            font-weight: 100;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Classic Moive Day</h1>
    <table cellpadding = 10px >
        <tr>
            <th> </th>
            <th>5 pm</th>
            <th>7 pm</th>
            <th>9 pm</th>
            <th>11 pm</th>
        </tr>
        <tr>
            <td style="font-weight: bold;">Screen one</td>
            <td>Star Wars</td>
            <td>Empire Strikes Back</td>
            <td>Return of the Jedi</td>
            <td>The Exorcist</td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Screen two</td>
            <td colspan="2">Dances with Wolves</td>
            <td colspan="2">Gone With the Wind</td>
        </tr>
        <tr>
            <td style="font-weight: bold;">Screen three</td>
            <td colspan="2">2001: A Space Odyssey</td>
            <td>The Conversation</td>
            <td>5 Easy Pieces</td>
        </tr>
    </table>
</body>
</html>
