<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <title>Tour Management</title>
    <style>
        #list {
            display: flex;
            justify-content: start;
        }
        
        img.tour-img {
            width: 100px;
            height: 60px;
            object-fit: cover;
        }
    </style>
    <script>
        function kiemTraMaTour() {
            let ma = document.getElementById("txtMaTour").value;
            let mau = /^T\d{3}$/;
            document.getElementById("errMaTour").innerHTML = mau.test(ma) ? "OK" : "NO";
            return mau.test(ma);
        }

        function kiemTraHanhTrinh() {
            let ht = document.getElementById("txtHanhTrinh").value;
            let mau = /^([A-Z][a-z]*)(\s[A-Z][a-z]*)+$/;
            document.getElementById("errHanhTrinh").innerHTML = mau.test(ht) ? "OK" : "NO";
            return mau.test(ht);
        }

        function kiemTraThoiGian() {
            let tg = document.getElementById("txtThoiGian").value;
            let mau = /^\d+\s(ngày|Ngày)$/;
            document.getElementById("errThoiGian").innerHTML = mau.test(tg) ? "OK" : "NO";
            return mau.test(tg);
        }

        function kiemTraGia() {
            let gia = document.getElementById("txtGia").value;
            let mau = /^\d{6,9}$/;
            document.getElementById("errGia").innerHTML = mau.test(gia) ? "OK" : "NO";
            return mau.test(gia);
        }

        function kiemTraAnh() {
            let file = document.getElementById("txtAnh").value;
            let mau = /\.(jpg|jpeg|png|gif)$/i;
            document.getElementById("errAnh").innerHTML = mau.test(file) ? "OK" : "NO";
            return mau.test(file);
        }

        let count = 1;

        function Singin() {
            if (!kiemTraMaTour() || !kiemTraHanhTrinh() || !kiemTraThoiGian() || !kiemTraGia() || !kiemTraAnh()) {
                alert("Vui lòng nhập đúng và đầy đủ thông tin.");
                return false;
            }

            let maTour = document.getElementById("txtMaTour").value;
            let hanhTrinh = document.getElementById("txtHanhTrinh").value;
            let ngayKhoiHanh = document.getElementById("txtNgayKhoiHanh").value;
            let thoiGian = document.getElementById("txtThoiGian").value;
            let gia = document.getElementById("txtGia").value;
            let anh = document.getElementById("txtAnh").files[0];

            let table = document.getElementById("tableinfo").getElementsByTagName("tbody")[0];
            let newrow = table.insertRow();

            newrow.insertCell(0).innerHTML = count;
            newrow.insertCell(1).innerHTML = maTour;
            newrow.insertCell(2).innerHTML = hanhTrinh;
            newrow.insertCell(3).innerHTML = ngayKhoiHanh;
            newrow.insertCell(4).innerHTML = thoiGian;
            newrow.insertCell(5).innerHTML = gia + " VNĐ";

            let reader = new FileReader();
            reader.onload = function(e) {
                newrow.insertCell(6).innerHTML = `<img src="${e.target.result}" class="tour-img">`;
            };
            reader.readAsDataURL(anh);

            count++;
        }
    </script>
</head>

<body>
    <div class="container-fluid">
        <div class="anh">
            <img src="../img/banner-5.png" alt="magazin" style="object-fit: cover;" width="100%">
        </div>
        <div id="list" class="mt-2">
            <ul class="nav">
                <li class="nav-item">
                    <a href="#" class="nav-link">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#mymodal">Thêm Tour</a>
                </li>
            </ul>
        </div>

        <table class="table table-hover" id="tableinfo">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã tour</th>
                    <th>Hành trình</th>
                    <th>Ngày khởi hành</th>
                    <th>Thời gian</th>
                    <th>Giá tour</th>
                    <th>Ảnh đại diện</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="modal" id="mymodal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4>Thêm Tour Mới</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label">Mã Tour</label>
                        <input type="text" id="txtMaTour" class="form-control" onblur="kiemTraMaTour()" placeholder="VD: T123">
                        <span class="text-danger" id="errMaTour">*</span><br>

                        <label class="form-label">Hành trình</label>
                        <input type="text" id="txtHanhTrinh" class="form-control" onblur="kiemTraHanhTrinh()" placeholder="Ví dụ: Ha Noi">
                        <span class="text-danger" id="errHanhTrinh">*</span><br>

                        <label class="form-label">Ngày khởi hành</label>
                        <input type="date" id="txtNgayKhoiHanh" class="form-control"><br>

                        <label class="form-label">Thời gian</label>
                        <input type="text" id="txtThoiGian" class="form-control" onblur="kiemTraThoiGian()" placeholder="Ví dụ: 3 ngày">
                        <span class="text-danger" id="errThoiGian">*</span><br>

                        <label class="form-label">Giá tour</label>
                        <input type="text" id="txtGia" class="form-control" onblur="kiemTraGia()">
                        <span class="text-danger" id="errGia">*</span><br>

                        <label class="form-label">Ảnh đại diện</label>
                        <input type="file" id="txtAnh" class="form-control" accept="image/*" onchange="kiemTraAnh()">
                        <span class="text-danger" id="errAnh">*</span><br>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success w-100" data-bs-dismiss="modal" onclick="Singin()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
