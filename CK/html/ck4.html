<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <style>
        .form-group,.form-combobox,.form-radius,.form-checkbox{
            display: flex;
        }
        .form-group input, .form-combobox select{
            flex: 1;
        }
        label{
            width: 150px;
        }
        span{
            margin-left: 150px;
        }

        img.avt{
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
    <script>
        function kiemTraTen(){
            let ten = document.getElementById("txtHoTen").value;
            let mauTen = /^[A-Z][a-z]*(\s[A-Z][a-z]*)+$/;
            if(mauTen.test(ten)){
                document.getElementById("errHoTen").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errHoTen").innerHTML = "NO";
                return false;
            }
        }

        function kiemTraTuoi(){
            let ns = document.getElementById("txtNgaySinh").value;
            let ngaySinh = new Date(ns);
            let namSinh = ngaySinh.getFullYear();
            let ngayHienTai = new Date();
            let namHienTai = ngayHienTai.getFullYear();
            let tuoi = namHienTai-namSinh;
            if(tuoi >=18){
                document.getElementById("errNgaySinh").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errNgaySinh").innerHTML = "NO";
                return false;
            }
        }

        function kiemTraMail(){
            let mail = document.getElementById("txtMail").value;
            let mauMai = /^[A-Za-z0-9!@#$%^&*_]+@gmail.com$/;
            if(mauMai.test(mail)){
                document.getElementById("errMail").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errMail").innerHTML = "NO";
                return false;
            }
        }

        function kiemTraSDT(){
            let sdt = document.getElementById("txtSDT").value;
            let mauSDT = /^0[2-9][0-9]{8}$/;
            if(mauSDT.test(sdt)){
                document.getElementById("errSDT").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errSDT").innerHTML = "NO";
                return false;
            }
        }

        function kiemTraDiaChi(){
            let diaChi = document.getElementById("txtDiaChi").value;
            let mauDiaChi = /^[0-9]{3}\s[A-Z][a-z]*(\s[A-Z][a-z]*)+$/;
            if(mauDiaChi.test(diaChi)){
                document.getElementById("errDiaChi").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errDiaChi").innerHTML = "NO";
                return false;
            }
        }

        function kiemTraAnh(){
            let anh = document.getElementById("txtAnh").value;
            let mauAnh = /\.(jpg|JPG|gif|GIF|IMG|img|jpeg|JPEG)/;
            if(mauAnh.test(anh)){
                document.getElementById("errAnh").innerHTML = "OK";
                return true;
            }
            else{
                document.getElementById("errAnh").innerHTML = "NO";
                return false;
            }
        }

        function tinhToan(){
            let khoaHoc = document.getElementById("cbKhoaHoc").value;
            switch (khoaHoc){
                case "Online":
                    document.getElementById("txtThoiGian").value = "3 thang";
                    break;
                case "Offline":
                    document.getElementById("txtThoiGian").value = "5 thang";
                    break;
                case "Ca 2":
                    document.getElementById("txtThoiGian").value = "7 thang";
                    break;
                default:
                    document.getElementById("txtThoiGian").value = "";
                    break;
            }
        }

        let count = 1;
        function Signin(){
            if(!kiemTraTen() || !kiemTraTuoi() || !kiemTraMail() || !kiemTraSDT() ||!kiemTraDiaChi() || !kiemTraAnh()){
                alert("Phai nhap dung du lieu");
                return false;
            }

            let hoTen = document.getElementById("txtHoTen").value;
            let ngaySinh = document.getElementById("txtNgaySinh").value;
            let mail = document.getElementById("txtMail").value;
            let sdt = document.getElementById("txtSDT").value;
            let diaChi = document.getElementById("txtDiaChi").value;
            let gioiTinh = document.querySelector('input[name="gt"]:checked').value;
            let khoaHoc = document.getElementById("cbKhoaHoc").value;
            let thoiGian = document.getElementById("txtThoiGian").value;
            let kyNangInfo = document.querySelectorAll('input[name="kn"]:checked');
            let kyNang = Array.from(kyNangInfo).map(e => e.value).join(", ");
            let anh = document.getElementById("txtAnh").files[0];
            let reader = new FileReader();

            let table = document.getElementById("tableinfo").getElementsByTagName("tbody")[0];
            let newrow = table.insertRow();

            let row0 = newrow.insertCell(0);
            let row1 = newrow.insertCell(1);
            let row2 = newrow.insertCell(2);
            let row3 = newrow.insertCell(3);
            let row4 = newrow.insertCell(4);
            let row5 = newrow.insertCell(5);
            let row6 = newrow.insertCell(6);
            let row7 = newrow.insertCell(7);
            let row8 = newrow.insertCell(8);
            let row9 = newrow.insertCell(9);
            let row10 = newrow.insertCell(10);

            row0.innerHTML = count;
            row1.innerHTML = hoTen;
            row2.innerHTML = ngaySinh;
            row3.innerHTML = mail;
            row4.innerHTML = sdt;
            row5.innerHTML = diaChi;
            row6.innerHTML = gioiTinh;
            row7.innerHTML = khoaHoc;
            row8.innerHTML = thoiGian;
            row9.innerHTML = kyNang.split(", ").join("<br>");
            
            reader.onload = function(e){
                row10.innerHTML = `<img src="${e.target.result}" class="avt">`;
            }
            reader.readAsDataURL(anh);
            count++;
            
        }
    </script>
    <title>Document</title>
</head>
<body>
    <div class="container-fluid">
        <div class="anh">
            <img src="../image/anh.png" alt="anh" width="100%">
        </div>
        <div class="list" style="margin-top: 10px;">
            <ul class="nav">
                <li class="nav-item">
                    <a href="#" class="nav-link">Trang Chu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Lien He</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gioi Thieu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Ngon Ngu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white bg-danger" data-bs-toggle="modal" data-bs-target="#mymodal" style="border-radius: 5px;">Dang Ky</a>
                </li>
            </ul>
        </div>
        <table class="table table-hover" id="tableinfo">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Ho Ten</th>
                    <th>Ngay Sinh</th>
                    <th>Mail</th>
                    <th>So Dien Thoai</th>
                    <th>Dia Chi</th>
                    <th>Gioi Tinh</th>
                    <th>Khoa Hoc</th>
                    <th>Thoi Gian</th>
                    <th>Ky Nang</th>
                    <th>Anh</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="modal" id="mymodal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4>Thong tin nhan vien</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="txtHoTen" class="form-label">Ho Ten</label>
                            <input type="text" id="txtHoTen" class="form-control" placeholder="Tran Quoc Nha" onblur="kiemTraTen()">
                        </div>
                        <span class="text-danger" id="errHoTen">*</span>

                         <div class="form-group">
                            <label for="txtNgaySinh" class="form-label">Ngay Sinh</label>
                            <input type="date" id="txtNgaySinh" class="form-control" onblur="kiemTraTuoi()">
                        </div>
                        <span class="text-danger" id="errNgaySinh">*</span>

                         <div class="form-group">
                            <label for="txtMail" class="form-label">Mail</label>
                            <input type="text" id="txtMail" class="form-control" placeholder="quocnha7@gmail.com" onblur="kiemTraMail()">
                        </div>
                        <span class="text-danger" id="errMail">*</span>

                         <div class="form-group">
                            <label for="txtSDT" class="form-label">So Dien Thoai</label>
                            <input type="text" id="txtSDT" class="form-control" placeholder="0365614176" onblur="kiemTraSDT()">
                        </div>
                        <span class="text-danger" id="errSDT">*</span>

                         <div class="form-group">
                            <label for="txtDiaChi" class="form-label">Dia Chi</label>
                            <input type="text" id="txtDiaChi" class="form-control" placeholder="842 Nguyen Kiem" onblur="kiemTraDiaChi()">
                        </div>
                        <span class="text-danger" id="errDiaChi">*</span>

                        <div class="form-radius">
                            <label for="" class="form-label">Gioi Tinh</label>
                            <input type="radio" class="form-check-input" value="Nam" name="gt" style="margin-right: 5px;" checked>Nam 
                            <input type="radio" class="form-check-input" value="Nu" name="gt" style="margin-right: 5px; margin-left: 10px;">Nu
                        </div>

                        <div class="form-combobox">
                            <label for="" class="form-label">Khoa Hoc</label>
                            <select name="cbKhoaHoc" id="cbKhoaHoc" class="form-select" onchange="tinhToan()">
                                <option value="" disabled hidden selected></option>
                                <option value="Online">Online</option>
                                <option value="Offline">Offline</option>
                                <option value="Ca 2">Ca 2</option>
                            </select>
                        </div>

                         <div class="form-group" style="margin-top: 10px;">
                            <label for="txtThoiGian" class="form-label">Thoi Gian</label>
                            <input type="text" id="txtThoiGian" class="form-control" disabled >
                        </div>

                        <div class="form-checkbox">
                            <label for="" class="form-label">Ky Nang</label>
                            <div>
                                <input type="checkbox" class="form-check-input" name="kn" value="Ky Nang Doc" checked>Ky Nang Doc <br>
                                <input type="checkbox" class="form-check-input" name="kn" value="Ky Nang Nghe">Ky Nang Nghe <br>
                                <input type="checkbox" class="form-check-input" name="kn" value="Ky Nang Viet">Ky Nang Viet
                            </div>
                        </div>

                         <div class="form-group">
                            <label for="txtAnh" class="form-label">Anh</label>
                            <input type="file" id="txtAnh" class="form-control" onchange="kiemTraAnh()">
                        </div>
                        <span class="text-danger" id="errAnh">*</span>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" data-bs-dismiss="modal" onclick="Signin()">Dang Ky</button>
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Huy</button>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
